
services:

  - type: web
    name: resume-analyzer-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

      - key: DATABASE_URL
        sync: false

      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: resume-analyzer-ui
    runtime: docker
    rootDir: frontend
    envVars:
      - key: API_URL
        sync: false